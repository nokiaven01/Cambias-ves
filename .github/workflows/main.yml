name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Install Dependencies
      run: npm i

    - name: Build Web App
      run: npm run build

    - name: Add Android Platform & Sync
      run: |
        npm install @capacitor/core @capacitor/android @capacitor/cli @capacitor/assets
        npx cap add android || true
        npx cap sync android

    - name: Generate App Icons
      run: |
        npx @capacitor/assets generate --android --iconBackgroundColor '#ffffff' --iconBackgroundColorDark '#111111'

    - name: Fix Kotlin Duplicate Classes Resolution
      run: |
        echo "
        subprojects {
            configurations.all {
                resolutionStrategy.eachDependency { DependencyResolveDetails details ->
                    if (details.requested.group == 'org.jetbrains.kotlin') {
                        if (details.requested.name == 'kotlin-stdlib-jdk7' || details.requested.name == 'kotlin-stdlib-jdk8') {
                            details.useTarget 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
                        }
                    }
                }
            }
        }
        " >> android/build.gradle

    - name: Grant execute permission for gradlew
      run: chmod +x android/gradlew

    - name: Build Debug APK
      run: cd android && ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: cambias-ves-debug
        path: android/app/build/outputs/apk/debug/app-debug.apk
