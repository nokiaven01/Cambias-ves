name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Install Dependencies
      run: npm i

    - name: Build Web App
      run: npm run build

    - name: Add Android Platform & Sync
      run: |
        npm install @capacitor/core @capacitor/android @capacitor/cli
        npx cap add android || true
        npx cap sync android

    - name: Fix Kotlin Duplicate Classes Conflict
      run: |
        echo "configurations.all { resolutionStrategy.force 'org.jetbrains.kotlin:kotlin-stdlib:1.9.22' }" >> android/build.gradle
        echo "configurations.all { exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7' }" >> android/build.gradle
        echo "configurations.all { exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8' }" >> android/build.gradle

    - name: Grant execute permission for gradlew
      run: chmod +x android/gradlew

    - name: Build Debug APK via Gradle
      run: cd android && ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: cambias-ves-debug
        path: android/app/build/outputs/apk/debug/app-debug.apk
